name: Extract Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir -p .extract_tmp
          unzip -o "AdGuardDnsAutoSwitch-GitHubActions.zip" -d .extract_tmp

          # ZIP内のプロジェクトファイルをリポジトリ直下へ展開
          cp -a .extract_tmp/AdGuardDnsAutoSwitch/. .

          rm -rf .extract_tmp

      - name: Remove ZIP
        run: rm -f "AdGuardDnsAutoSwitch-GitHubActions.zip"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Android project from ZIP"
          git push
